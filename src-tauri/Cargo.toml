[package]
name = "db-manager"
version = "0.1.0"
description = "Desktop client for Postgres, MySQL, SQLite, MongoDB and Redis"
authors = ["Gabriel Martins"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows (cargo#8519)
name = "db_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
# ponytail: keyring 3.x; 4.x split into keyring-core + store crates, migrate when 3.x stops building
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
