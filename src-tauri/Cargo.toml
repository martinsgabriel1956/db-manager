[package]
name = "ordo"
version = "0.1.0"
description = "Desktop client for Postgres, MySQL, SQLite, MongoDB and Redis"
authors = ["Gabriel Martins"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows (cargo#8519)
name = "ordo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
# ponytail: keyring 3.x; 4.x split into keyring-core + store crates, migrate when 3.x stops building
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "mysql", "sqlite", "runtime-tokio", "tls-rustls-ring-native-roots", "json"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
futures-util = "0.3"
sqlparser = "0.63.0"
tauri-plugin-store = "2"
mongodb = "3.9"
# rustls without a provider feature: it uses ring, already enabled by sqlx
redis = { version = "1.7", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-insecure"] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
testcontainers-modules = { version = "0.15", features = ["postgres", "mysql", "mongo", "redis"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
