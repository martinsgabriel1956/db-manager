# Demo databases for trying the app locally. Throwaway data and credentials.
#   docker compose -f dev/demo/compose.yml up -d     # start (seeds on first run)
#   docker compose -f dev/demo/compose.yml down -v   # stop and delete the data
# Postgres: host localhost, port 55432, database demo, user demo, password demo.
# MySQL:    host localhost, port 53306, database shop, user demo, password demo.
# MongoDB:  host localhost, port 57017, database shop (no authentication).
# Redis:    host localhost, port 56379, database 0 (no password).
# SQLite:   python3 dev/demo/make-sqlite.py  →  dev/demo/demo.sqlite
services:
  postgres:
    image: postgres:17
    container_name: db-manager-demo
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - demo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 2s
      retries: 30

  mysql:
    image: mysql:8.1
    container_name: db-manager-demo-mysql
    environment:
      MYSQL_DATABASE: shop
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
      MYSQL_ROOT_PASSWORD: demo
    ports:
      - "127.0.0.1:53306:3306"
    volumes:
      - ./seed-mysql.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - demo-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -udemo -pdemo --silent"]
      interval: 2s
      retries: 60

  mongo:
    image: mongo:5.0.6
    container_name: db-manager-demo-mongo
    ports:
      - "127.0.0.1:57017:27017"
    volumes:
      - ./seed-mongo.js:/docker-entrypoint-initdb.d/seed.js:ro
      - demo-mongo-data:/data/db

  redis:
    image: redis:7.4-alpine
    container_name: db-manager-demo-redis
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - demo-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  # Redis has no init scripts: load the seed once, then exit
  redis-seed:
    image: redis:7.4-alpine
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./seed-redis.redis:/seed.redis:ro
    entrypoint:
      - sh
      - -c
      - redis-cli -h redis EXISTS demo:seeded | grep -q 1 || redis-cli -h redis < /seed.redis

volumes:
  demo-data:
  demo-mysql-data:
  demo-mongo-data:
  demo-redis-data:
