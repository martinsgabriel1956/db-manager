name: Release

# a version tag builds the bundles for Linux, Windows and macOS and publishes them on GitHub Releases:
#   bump package.json + src-tauri/tauri.conf.json, then `git tag v0.2.0 && git push --tags`
# a manual run only builds: the bundles stay as artifacts of the run, with no release,
# tag, signature or latest.json (`gh workflow run Release --ref <branch>`)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  # create the release and upload its files
  contents: write

jobs:
  # cheap checks once, before three platforms start compiling
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # a v0.2.0 tag over a 0.1.0 build would publish files named after the wrong version
      - name: Tag matches the app version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(jq -r .version src-tauri/tauri.conf.json)
          web=$(jq -r .version package.json)
          if [ "$tag" != "$app" ] || [ "$tag" != "$web" ]; then
            echo "::error::tag $GITHUB_REF_NAME, tauri.conf.json $app, package.json $web: suba as três juntas"
            exit 1
          fi

      # unsigned bundles would publish a latest.json no install can verify: stop before compiling
      - name: Signing key is set
        if: github.event_name == 'push'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::secret TAURI_SIGNING_PRIVATE_KEY ausente: veja docs/release.md"
            exit 1
          fi

  build:
    needs: check
    strategy:
      # one platform failing still publishes the others
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,appimage,rpm
            args: ""
          - os: windows-latest
            bundles: nsis
            args: ""
          # one .app for Apple Silicon and Intel
          - os: macos-latest
            bundles: app,dmg
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      # the updater artifacts need the signing key: only the tagged release makes them
      UPDATER_ARGS: >-
        ${{ github.event_name == 'push' && '--config {"bundle":{"createUpdaterArtifacts":true}}' || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # each job adds its files and its platforms to the same release and latest.json
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the key signs each bundle (.sig); it lives only in the repo secrets, never in a file
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # no tag on a manual run: the action builds and publishes nothing
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          # __VERSION__ is filled by the action from tauri.conf.json: "Ordo 0.2.0", like v0.1.0
          releaseName: Ordo __VERSION__
          generateReleaseNotes: true
          # Updater artifacts (the .sig files) only here, so a local `pnpm tauri build` needs no key
          args: ${{ matrix.args }} --bundles ${{ matrix.bundles }} ${{ env.UPDATER_ARGS }}
          # latest.json: what the app's updater reads (plugins.updater.endpoints in tauri.conf.json)
          uploadUpdaterJson: true

      - name: Bundles of a manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ordo-${{ runner.os }}
          # macOS builds under target/universal-apple-darwin/; only the .dmg, the .app is inside it
          path: |
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.dmg
          if-no-files-found: error
          retention-days: 7

  # checksums of what people download by hand; the .sig files cover the updater
  checksums:
    needs: build
    # with one platform failed, the others still get their checksums
    if: ${{ github.event_name == 'push' && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir pkgs \
            --pattern '*.deb' --pattern '*.rpm' --pattern '*.AppImage' --pattern '*.exe' --pattern '*.dmg'
          cd pkgs
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
