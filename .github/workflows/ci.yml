name: CI

on:
  push:
    branches: [main]
  pull_request:
  # manual runs from the Actions tab or `gh workflow run CI`
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-24.04
    env:
      # two full debug builds (clippy + the instrumented coverage build) with full debuginfo
      # filled the runner's disk and crashed the linker (ld: signal 7, bus error); file:line
      # in backtraces is all the tests need, and coverage does not use debuginfo
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: taiki-e/install-action@cargo-llvm-cov

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

      # main.rs/lib.rs only wire Tauri together; everything with logic is measured
      - name: Tests + coverage gate (70%)
        run: cargo llvm-cov --ignore-filename-regex '(main|lib)\.rs$' --fail-under-lines 70

      # the test run regenerates src/bindings.ts; a diff means Rust and TS types drifted
      - name: Bindings are up to date
        run: git diff --exit-code ../src/bindings.ts

      # how close the job runs to the runner's disk limit, also when a step above failed
      - name: Disk usage
        if: always()
        run: df -h . && du -sh target

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      # thresholds (70%) live in vite.config.ts
      - run: pnpm test:coverage
